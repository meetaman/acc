<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounts Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .navbar {
            background-color: #2c3e50;
        }
        .navbar-brand, .nav-link {
            color: white !important;
        }
        .card {
            border: none;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .btn-primary {
            background-color: #2c3e50;
            border-color: #2c3e50;
        }
        .btn-primary:hover {
            background-color: #34495e;
            border-color: #34495e;
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/dashboard">Accounting System</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard">
                            <i class="fas fa-home"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/party_master">
                            <i class="fas fa-users"></i> Party Master
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/product_master">
                            <i class="fas fa-box"></i> Product Master
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/incoming_bills">
                            <i class="fas fa-file-invoice"></i> Incoming Bills
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/view_bills">
                            <i class="fas fa-list"></i> View Bills
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/accounts">
                            <i class="fas fa-book"></i> Accounts
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-md-4">
                <div class="card mb-4">
                    <div class="card-body">
                        <h5 class="card-title">Add/Edit Account</h5>
                        <form id="accountForm">
                            <input type="hidden" id="a_id">
                            <div class="mb-3">
                                <label for="name" class="form-label">Account Name</label>
                                <input type="text" class="form-control" id="name" required>
                            </div>
                            <div class="mb-3">
                                <label for="type" class="form-label">Account Type</label>
                                <select class="form-select" id="type" required>
                                    <option value="">Select Type</option>
                                    <option value="Bank">Bank</option>
                                    <option value="Cash">Cash</option>
                                    <option value="Colour Chemical">Cash</option>
                                    <option value="Process">Cash</option>
                                    <option value="Coal & Fuel">Cash</option>
                                    <option value="Credit">Credit</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary">Save Account</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Accounts List</h5>
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>A_ID</th>
                                        <th>Name</th>
                                        <th>Type</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="accountsTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Account</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editForm">
                        <input type="hidden" id="edit_a_id">
                        <div class="mb-3">
                            <label for="edit_name" class="form-label">Account Name</label>
                            <input type="text" class="form-control" id="edit_name" required>
                        </div>
                        <div class="mb-3">
                            <label for="edit_type" class="form-label">Account Type</label>
                            <select class="form-select" id="edit_type" required>
                                <option value="">Select Type</option>
                                <option value="Bank">Bank</option>
                                <option value="Cash">Cash</option>
                                <option value="Credit">Credit</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" id="saveEdit">Save changes</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Load accounts when page loads
        document.addEventListener('DOMContentLoaded', loadAccounts);

        // Handle form submission
        document.getElementById('accountForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const a_id = document.getElementById('a_id').value;
            const name = document.getElementById('name').value;
            const type = document.getElementById('type').value;

            try {
                const response = await fetch('/api/accounts', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ a_id, name, type })
                });

                if (response.ok) {
                    loadAccounts();
                    document.getElementById('accountForm').reset();
                    document.getElementById('a_id').value = '';
                } else {
                    alert('Error saving account');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error saving account');
            }
        });

        // Load accounts from server
        async function loadAccounts() {
            try {
                const response = await fetch('/api/accounts');
                const accounts = await response.json();
                
                const tbody = document.getElementById('accountsTableBody');
                tbody.innerHTML = '';
                
                accounts.forEach(account => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${account[0]}</td>
                        <td>${account[1]}</td>
                        <td>${account[2]}</td>
                        <td>
                            <button class="btn btn-sm btn-primary" onclick="editAccount('${account[0]}', '${account[1]}', '${account[2]}')">
                                <i class="fas fa-edit"></i>
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error('Error:', error);
                alert('Error loading accounts');
            }
        }

        // Edit account
        function editAccount(a_id, name, type) {
            document.getElementById('edit_a_id').value = a_id;
            document.getElementById('edit_name').value = name;
            document.getElementById('edit_type').value = type;
            
            const editModal = new bootstrap.Modal(document.getElementById('editModal'));
            editModal.show();
        }

        // Save edited account
        document.getElementById('saveEdit').addEventListener('click', async () => {
            const a_id = document.getElementById('edit_a_id').value;
            const name = document.getElementById('edit_name').value;
            const type = document.getElementById('edit_type').value;

            try {
                const response = await fetch(`/api/accounts/${a_id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, type })
                });

                if (response.ok) {
                    loadAccounts();
                    bootstrap.Modal.getInstance(document.getElementById('editModal')).hide();
                } else {
                    alert('Error updating account');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error updating account');
            }
        });
    </script>
</body>
</html>
