<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Master</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .form-container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .table-container {
            max-width: 1000px;
            margin: 20px auto;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .nav-link {
            color: #007bff;
            text-decoration: none;
        }
        .nav-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="/">Dashboard</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/party_master">Party Master</a>
                <a class="nav-link active" href="/product_master">Product Master</a>
            </div>
        </div>
    </nav>

    <div class="form-container">
        <h2 class="mb-4">Add New Product</h2>
        <form id="productForm">
            <div class="mb-3">
                <label for="name" class="form-label">Product Name</label>
                <input type="text" class="form-control" id="name" required>
            </div>
            <div class="mb-3">
                <label for="hsn_code" class="form-label">HSN Code</label>
                <input type="text" class="form-control" id="hsn_code" required>
            </div>
            <div class="mb-3">
                <label for="type" class="form-label">Type</label>
                <input type="text" class="form-control" id="type" required>
            </div>
            <button type="submit" class="btn btn-primary">Add Product</button>
        </form>
    </div>

    <div class="table-container">
        <h2 class="mb-4">Product List</h2>
        <div class="table-responsive">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>S.No</th>
                        <th>Product Name</th>
                        <th>HSN Code</th>
                        <th>Type</th>
                    </tr>
                </thead>
                <tbody id="productTableBody">
                    <!-- Data will be populated here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Function to load product data
        async function loadProductData() {
            try {
                const response = await fetch('/api/product-data');
                const data = await response.json();
                const tbody = document.getElementById('productTableBody');
                tbody.innerHTML = '';

                data.forEach(product => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${product[0]}</td>
                        <td>${product[1]}</td>
                        <td>${product[2]}</td>
                        <td>${product[3]}</td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (error) {
                console.error('Error loading product data:', error);
            }
        }

        // Handle form submission
        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const productData = {
                name: document.getElementById('name').value,
                hsn_code: document.getElementById('hsn_code').value,
                type: document.getElementById('type').value
            };

            try {
                const response = await fetch('/api/product-data', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(productData)
                });

                if (response.ok) {
                    // Clear form
                    document.getElementById('productForm').reset();
                    // Reload data
                    loadProductData();
                } else {
                    console.error('Error adding product');
                }
            } catch (error) {
                console.error('Error:', error);
            }
        });

        // Load data when page loads
        loadProductData();
    </script>
</body>
</html>
